name: Signed Android release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  signed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate release configuration
        env:
          KEYSTORE: ${{ secrets.SPEED_BUDDY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SPEED_BUDDY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPEED_BUDDY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPEED_BUDDY_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Release signing secrets are missing'; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git fetch origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo 'Release tag must point to main history'; exit 1; }
            version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
            test "$GITHUB_REF_NAME" = "v$version" || { echo 'Tag does not match Android versionName'; exit 1; }
          fi
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.SPEED_BUDDY_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/speedbuddy-release.jks"
          test -s "$RUNNER_TEMP/speedbuddy-release.jks"
      - name: Test and build signed APK
        env:
          SPEED_BUDDY_KEYSTORE_FILE: ${{ runner.temp }}/speedbuddy-release.jks
          SPEED_BUDDY_STORE_PASSWORD: ${{ secrets.SPEED_BUDDY_STORE_PASSWORD }}
          SPEED_BUDDY_KEY_ALIAS: ${{ secrets.SPEED_BUDDY_KEY_ALIAS }}
          SPEED_BUDDY_KEY_PASSWORD: ${{ secrets.SPEED_BUDDY_KEY_PASSWORD }}
        run: gradle testDebugUnitTest lintDebug assembleRelease --no-daemon
      - name: Verify signed APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p release
          cp "$apk" release/SpeedBuddy-release.apk
          sha256sum release/SpeedBuddy-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: speed-buddy-signed-acceptance
          path: release/SpeedBuddy-release.apk
          retention-days: 30
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/SpeedBuddy-release.apk --verify-tag --title "Speed Buddy $GITHUB_REF_NAME" --generate-notes
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/speedbuddy-release.jks"
