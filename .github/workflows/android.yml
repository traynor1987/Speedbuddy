name: Android
on:
  push:
  pull_request:
permissions: { contents: read }
env:
  SPEED_BUDDY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SPEED_BUDDY_SOURCE_SHA }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease lintDebug lintRelease --no-daemon --no-configuration-cache
      - run: python3 scripts/check_release_pipeline.py
      # Validation debug APKs use ephemeral test keys and are never owner artifacts.
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-reports, path: app/build/reports/ }
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SPEED_BUDDY_SOURCE_SHA }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: database-test-reports, path: app/build/reports/androidTests/ }
  signed-owner-acceptance:
    permissions: { contents: write, actions: read }
    if: github.event_name == 'push'
    needs: [build, database-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check permanent signer setup
        id: signer
        env:
          OWNER_KEY: ${{ secrets.SPEED_BUDDY_KEYSTORE_BASE64 }}
          OWNER_STORE_PASSWORD: ${{ secrets.SPEED_BUDDY_STORE_PASSWORD }}
          OWNER_ALIAS: ${{ secrets.SPEED_BUDDY_KEY_ALIAS }}
          OWNER_KEY_PASSWORD: ${{ secrets.SPEED_BUDDY_KEY_PASSWORD }}
          OWNER_CERTIFICATE: ${{ vars.SPEED_BUDDY_SIGNING_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import os, re
          names = ['OWNER_KEY', 'OWNER_STORE_PASSWORD', 'OWNER_ALIAS', 'OWNER_KEY_PASSWORD', 'OWNER_CERTIFICATE']
          values = [os.environ.get(name, '') for name in names]
          if any(values) and not all(values):
              raise SystemExit('Permanent signing setup is incomplete; no owner APK will be produced.')
          ready = all(values)
          if ready and not re.fullmatch(r'[0-9a-f]{64}', values[-1]):
              raise SystemExit('Invalid public certificate pin; no owner APK will be produced.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=' + str(ready).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Permanent signer configured.\n' if ready else
                  'NO ACCEPTANCE APK: owner must run scripts/setup_owner_signer.py on a trusted computer, then re-run this PUSH run. Do not uninstall yet.\n')
          PY
      - uses: actions/checkout@v4
        if: steps.signer.outputs.ready == 'true'
        with: { ref: '${{ env.SPEED_BUDDY_SOURCE_SHA }}' }
      - uses: actions/setup-java@v4
        if: steps.signer.outputs.ready == 'true'
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
        if: steps.signer.outputs.ready == 'true'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signer.outputs.ready == 'true'
        with: { gradle-version: '8.13' }
      - if: steps.signer.outputs.ready == 'true'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build exact unsigned release
        if: steps.signer.outputs.ready == 'true'
        run: |
          test "$(git rev-parse HEAD)" = "$SPEED_BUDDY_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          gradle assembleRelease --no-daemon --no-configuration-cache
      - name: Sign and verify permanent owner APK
        if: steps.signer.outputs.ready == 'true'
        env:
          OWNER_KEY: ${{ secrets.SPEED_BUDDY_KEYSTORE_BASE64 }}
          OWNER_STORE_PASSWORD: ${{ secrets.SPEED_BUDDY_STORE_PASSWORD }}
          OWNER_ALIAS: ${{ secrets.SPEED_BUDDY_KEY_ALIAS }}
          OWNER_KEY_PASSWORD: ${{ secrets.SPEED_BUDDY_KEY_PASSWORD }}
          OWNER_CERTIFICATE: ${{ vars.SPEED_BUDDY_SIGNING_CERT_SHA256 }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64, os, json
          from pathlib import Path
          tracked=json.loads(Path('docs/owner-signing-certificate.json').read_text())['certificateSha256']
          if os.environ['OWNER_CERTIFICATE'] != tracked:
              raise SystemExit('CI signer differs from the tracked permanent owner identity; no APK produced.')
          Path(os.environ['RUNNER_TEMP'], 'speedbuddy-owner.jks').write_bytes(base64.b64decode(os.environ['OWNER_KEY'], validate=True))
          PY
          mkdir -p acceptance
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/speedbuddy-owner.jks" --ks-key-alias "$OWNER_ALIAS" --ks-pass env:OWNER_STORE_PASSWORD --key-pass env:OWNER_KEY_PASSWORD --out acceptance/SpeedBuddy-0.3.0-owner-acceptance.apk app/build/outputs/apk/release/app-release-unsigned.apk
          python3 scripts/verify_owner_apk.py --apk acceptance/SpeedBuddy-0.3.0-owner-acceptance.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0" --source-sha "$SPEED_BUDDY_SOURCE_SHA" --certificate "$OWNER_CERTIFICATE" --version-code 19 --version-name 0.3.0 --output acceptance/owner-build.json
      - name: Remove temporary private key
        if: always()
        run: rm -f "$RUNNER_TEMP/speedbuddy-owner.jks"
      - uses: actions/upload-artifact@v4
        if: success() && steps.signer.outputs.ready == 'true'
        with:
          name: speed-buddy-owner-acceptance-${{ github.sha }}
          path: acceptance/
          if-no-files-found: error
      - name: Publish exact-source physical retest candidate after independent PR validation
        if: success() && steps.signer.outputs.ready == 'true' && github.ref == 'refs/heads/feat/android-auto-ui-0.3.0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Validation jobs for this push have passed; also require the independent PR run.
          for attempt in $(seq 1 80); do
            conclusion=$(gh run list --commit "$SPEED_BUDDY_SOURCE_SHA" --event pull_request --workflow Android --limit 20 --json status,conclusion --jq '[.[] | select(.status == "completed")][0].conclusion // "pending"')
            if [ "$conclusion" = success ]; then break; fi
            if [ "$conclusion" != pending ]; then echo 'Independent PR validation failed; candidate publication refused.'; exit 1; fi
            sleep 15
          done
          test "$conclusion" = success
          test "$(gh api "repos/$GH_REPO/git/ref/heads/feat/android-auto-ui-0.3.0" --jq .object.sha)" = "$SPEED_BUDDY_SOURCE_SHA"
          tag="v0.3.0-android-auto-ui-${SPEED_BUDDY_SOURCE_SHA:0:12}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SPEED_BUDDY_SOURCE_SHA" --prerelease --title 'Speed Buddy 0.3.0 — Android Auto visual and road-state overhaul' --notes-file docs/ANDROID_AUTO_0.3.0_RETEST.md
          fi
          gh release upload "$tag" acceptance/SpeedBuddy-0.3.0-owner-acceptance.apk acceptance/owner-build.json --clobber
