name: Android
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: speed-buddy-debug, path: app/build/outputs/apk/debug/*.apk }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-reports, path: app/build/reports/ }
  database-tests:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: database-test-reports, path: app/build/reports/androidTests/ }
